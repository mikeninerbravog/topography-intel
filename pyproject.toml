[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "topography-intel"
version = "0.0.1"
description = "Deterministic tools for topographic calculations."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
